<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de CSS aplicado a párrafos</title>
  <style>
    /* Regla que afecta a todos los párrafos de la página */
    p {
      text-align: center; /* centra el texto */
      color: red;         /* cambia el color a rojo */
    }
  </style>
</head>
<body>
  <p>Estilo para el párrafo</p>
  <p>¡Y este también!</p>
  <p>¡Y otro más!</p>
</body>
</html>
