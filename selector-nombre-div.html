<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de CSS aplicado a div</title>
  <style>
    /* Regla que afecta a todos los div de la página */
    div {
      border: 5px double black;      /* borde doble */
      background-color: lightblue;   /* color de fondo */
      text-align: center;            /* centra el contenido */
      margin: 15px 0;                /* espacio entre bloques */
      padding: 10px;                 /* espacio interno */
    }
  </style>
</head>
<body>
  <h1>Efecto para los div</h1>

  <div>
    <h2>Título 1</h2>
    <p>Contenido del primer div</p>
  </div>

  <div>
    <h2>Título 2</h2>
    <p>Contenido del segundo div</p>
  </div>
</body>
</html>
