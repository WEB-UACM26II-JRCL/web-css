<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de CSS con id</title>
  <style>
    /* Solo afecta al párrafo con id="p1" */
    #p1 {
      text-align: center; /* centra el texto */
      color: red;         /* cambia el color a rojo */
    }
  </style>
</head>
<body>
  <p id="p1">Párrafo afectado</p>
  <p>Párrafo no afectado</p>
</body>
</html>
