<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de selector combinado</title>
  <style>
    /* Solo afecta a los párrafos con la clase "centrar" */
    p.centrar {
      text-align: center;
      color: red;
    }
  </style>
</head>
<body>
  <h1 class="centrar">No es afectado ya que es una cabecera</h1>
  <p class="centrar">Sí es afectado ya que es un párrafo</p> 
</body>
</html>
