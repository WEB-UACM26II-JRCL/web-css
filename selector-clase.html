<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de clases en CSS</title>
  <style>
    .ejemplo1 {
      text-align: center;
      background-color: black;
      color: white;
      padding: 10px;
      margin: 10px 0;
    }

    .ejemplo2 {
      text-align: right;
      background-color: turquoise;
      color: darkblue;
      padding: 10px;
      margin: 10px 0;
    }

    .ejemplo3 {
      text-align: left;
      background-color: green;
      color: white;
      padding: 10px;
      margin: 10px 0;
    }

    .ejemplo4 {
      text-align: center;
      background-color: khaki;
      color: purple;
      padding: 10px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Ejemplo de selectores de clase</h1>

  <div class="ejemplo1">Div con el primer estilo</div>
  <div class="ejemplo2">Div con el segundo estilo</div>
  <div class="ejemplo3">Div con el tercer estilo</div>
  <div class="ejemplo4">Div con el cuarto estilo</div>
</body>
</html>
