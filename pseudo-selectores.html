<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de pseudoclases en enlaces</title>
  <style>
    /* Enlace sin visitar */
    a:link { 
      color: red; 
    }

    /* Enlace visitado */
    a:visited { 
      color: blue; 
    }

    /* Al pasar el cursor sobre el enlace */
    a:hover { 
      color: yellow; 
    }

    /* Mientras se hace clic en el enlace */
    a:active { 
      color: lime; 
    }
  </style>
</head>
<body>
  <h1>Ejemplo de pseudoclases en enlaces</h1>

  <a href="http://pacifico.izt.uam.mx/moodle">Enlace al Moodle</a><br>
  <a href="http://www.izt.uam.mx">Enlace a la página de UAM-I</a><br>
  <a href="http://www.uam.mx">Enlace a la página principal UAM</a><br>
  <a href="http://www.hola.com">Enlace a Hola!</a>
</body>
</html>
