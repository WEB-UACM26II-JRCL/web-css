<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de sitio con menú desplegable</title>
  <!-- Enlace a la hoja de estilos externa -->

</head>
<body>

  <!-- Cabecera -->
  <div id="cuadro-cabecera">
    <div id="logo">
      <h1>t-construcción</h1>
      <p>Ciudad de México</p>
    </div>         
  </div>
  <!-- Fin cabecera -->

  <!-- Menú principal -->
  <div id="cuadro-menu">
    <ul id="menu">
      <li class="item-actual"><span>Inicio</span></li>
      <li>
        Sucursales
        <ul id="sub-menu">
          <li>Iztapalapa</li>
          <li>Tláhuac</li>
          <li>Iztacalco</li>
        </ul>
      </li>
      <li>Fotos</li>
      <li>Quiénes somos?</li>
      <li>
        Enlaces externos
        <ul>
          <li>Profeco</li>
          <li>CasasGeo</li>
          <li>Quiero Casa</li>
        </ul>
      </li>
      <li>Contacto</li>
    </ul>
  </div>
  <!-- Fin menú -->

  <!-- Imagen principal -->
  <div id="imgp">
    <img src="linux.png" width="480" height="300" alt="Imagen principal" />
  </div>  

</body>
</html>
